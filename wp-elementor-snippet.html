<!-- =====================================================
  ASUNTORÄÄTÄLI – 360° PANORAAMA KOKO SIVUN TAUSTANA
  Liitä tämä KOKO sisältö Elementor Custom HTML -widgettiin
  ===================================================== -->

<style>
/* ── Panoraamakanvas – koko ruutu, aina taustalla ── */
#asra-pano-wrap {
  position: fixed;
  top: 0; left: 0;
  width: 100vw;
  height: 100vh;
  z-index: 0;
  pointer-events: none;
}
#asra-pano-canvas {
  display: block;
  width: 100%;
  height: 100%;
}

/* ── Tumma overlay – säädä viimeistä lukua (0–1):
      0.3 = vaalea, 0.55 = tumma, 0.75 = hyvin tumma ── */
#asra-overlay {
  position: fixed;
  inset: 0;
  z-index: 1;
  pointer-events: none;
  background: rgba(5, 15, 35, 0.50);
  backdrop-filter: blur(1px);
  -webkit-backdrop-filter: blur(1px);
}

/* ── Elementor-osiot läpinäkyviksi jotta panoraama näkyy ──
   Jos haluat jonkin osion omalla taustavärillä, poista se täältä
   ja aseta sen tausta Elementorissa suoraan. ── */
.elementor-section,
.elementor-top-section,
.e-con[data-element_type="container"] {
  background-color: transparent !important;
  background-image: none !important;
  position: relative !important;
  z-index: 2 !important;
}

/* ── Header pysyy aina ylimpänä ── */
#masthead,
.site-header,
header,
.elementor-location-header {
  position: relative !important;
  z-index: 1000 !important;
}
</style>

<!-- Panorama canvas -->
<div id="asra-pano-wrap">
  <canvas id="asra-pano-canvas"></canvas>
</div>

<!-- Tumma overlay tekstien taustaksi -->
<div id="asra-overlay"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
<script>
(function () {
  var canvas = document.getElementById('asra-pano-canvas');

  /* ── Konfiguraatio ── */
  var START_RAD   = 226 * Math.PI / 180;
  var BASE_SPEED  = 0.00018;   /* automaattipyörintä – hidas koko sivun ajan */
  var SCROLL_MULT = 0.00030;   /* scroll lisää vauhtia */
  var FRICTION    = 0.88;

  var currentAngle   = START_RAD;
  var scrollVelocity = 0;
  var lastScrollY    = window.scrollY;

  /* ── Three.js ── */
  var scene    = new THREE.Scene();
  var camera   = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
  var renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  camera.position.set(0, 0, 0.01);

  window.addEventListener('resize', function () {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  /* Inside-out sphere */
  var geo = new THREE.SphereGeometry(500, 64, 32);
  geo.scale(-1, 1, 1);

  var sphere = null;
  new THREE.TextureLoader().load(
    'https://asuntoraatali.fi/wp-content/uploads/2026/06/spherical-scaled.jpg',
    function (tex) {
      tex.minFilter = tex.magFilter = THREE.LinearFilter;
      tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
      sphere = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ map: tex }));
      sphere.rotation.y = currentAngle;
      scene.add(sphere);
    }
  );

  /* ── Scroll boosti ── */
  window.addEventListener('scroll', function () {
    var dy = window.scrollY - lastScrollY;
    lastScrollY = window.scrollY;
    scrollVelocity += dy * SCROLL_MULT;
  });

  /* ── Animaatiosilmukka – käy koko sivun ajan ── */
  function tick() {
    requestAnimationFrame(tick);
    currentAngle   += BASE_SPEED + scrollVelocity;
    scrollVelocity *= FRICTION;
    if (sphere) sphere.rotation.y = currentAngle;
    renderer.render(scene, camera);
  }
  tick();

})();
</script>
