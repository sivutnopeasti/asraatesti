<!-- =====================================================
  ASUNTORÄÄTÄLI – 360° PANORAAMA HERO BACKGROUND
  Liitä tämä KOKO sisältö Elementor Custom HTML -widgettiin
  ===================================================== -->

<style>
/* Kanvas on fixed koko ruudun taustalla – IntersectionObserver
   piilottaa sen heti kun hero ei ole enää näkyvissä */
#asra-pano-wrap {
  position: fixed;
  top: 0; left: 0;
  width: 100vw;
  height: 100vh;
  z-index: 0;
  pointer-events: none;
  transition: opacity 0.4s;
}
#asra-pano-wrap.asra-hidden {
  opacity: 0;
  pointer-events: none;
}
#asra-pano-canvas {
  display: block;
  width: 100%;
  height: 100%;
}
/* Sentinel – näkymätön div, jonka näkyvyyttä seurataan */
#asra-sentinel {
  position: absolute;
  bottom: 0; left: 0;
  width: 1px; height: 1px;
  pointer-events: none;
}
</style>

<!-- Sentinel seuraa hero-osion loppua -->
<div id="asra-sentinel"></div>

<!-- Fixed panorama canvas -->
<div id="asra-pano-wrap" class="asra-hidden">
  <canvas id="asra-pano-canvas"></canvas>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
<script>
(function () {
  var wrap     = document.getElementById('asra-pano-wrap');
  var canvas   = document.getElementById('asra-pano-canvas');
  var sentinel = document.getElementById('asra-sentinel');

  /* ── Three.js ── */
  var scene    = new THREE.Scene();
  var camera   = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
  var renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);

  window.addEventListener('resize', function () {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  /* Inside-out sphere */
  var geo = new THREE.SphereGeometry(500, 64, 32);
  geo.scale(-1, 1, 1);

  var sphere = null;
  var loader = new THREE.TextureLoader();

  /* Kuva WP:n mediasta – sama domain, ei CORS */
  loader.load(
    'https://asuntoraatali.fi/wp-content/uploads/2026/06/spherical-scaled.jpg',
    function (tex) {
      tex.minFilter = tex.magFilter = THREE.LinearFilter;
      tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
      sphere = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ map: tex }));
      sphere.rotation.y = 226 * Math.PI / 180;
      scene.add(sphere);
    }
  );

  camera.position.set(0, 0, 0.01);

  /* ── Auto-rotation + scroll boost ── */
  var currentAngle   = 226 * Math.PI / 180;
  var scrollVelocity = 0;
  var lastScrollY    = window.scrollY;

  window.addEventListener('scroll', function () {
    var dy = window.scrollY - lastScrollY;
    lastScrollY = window.scrollY;
    scrollVelocity += dy * 0.00044;
  });

  function tick() {
    requestAnimationFrame(tick);
    currentAngle   += 0.00028 + scrollVelocity;
    scrollVelocity *= 0.86;
    if (sphere) sphere.rotation.y = currentAngle;
    renderer.render(scene, camera);
  }
  tick();

  /* ── IntersectionObserver: näytä/piilota kun hero on näkyvissä ── */
  var io = new IntersectionObserver(
    function (entries) {
      if (entries[0].isIntersecting) {
        wrap.classList.remove('asra-hidden');
      } else {
        wrap.classList.add('asra-hidden');
      }
    },
    { threshold: 0 }
  );
  io.observe(sentinel);

})();
</script>
