<!-- =====================================================
  ASUNTORÄÄTÄLI – 360° PANORAAMA TAUSTA
  Liitä tämä KOKO sisältö Elementor Custom HTML -widgettiin
  Hero-kontaineri: ensimmäinen elementti
  ===================================================== -->

<style>
/* ── Panoraamakanvas – koko ruutu, aina taustalla ── */
#asra-pano-wrap {
  position: fixed;
  top: 0; left: 0;
  width: 100vw;
  height: 100vh;
  z-index: 0;
  pointer-events: none;
  display: none; /* JS näyttää heti kun kuva latautuu */
}
#asra-pano-canvas {
  display: block;
  width: 100%;
  height: 100%;
}

/* ── Tumma overlay – säädä viimeistä lukua (0–1):
      0.3 = vaalea, 0.55 = tumma, 0.75 = hyvin tumma ── */
#asra-overlay {
  position: fixed;
  inset: 0;
  z-index: 1;
  pointer-events: none;
  background: rgba(5, 15, 35, 0.50);
}

/* ── Header pysyy aina ylimpänä ── */
#masthead,
.site-header,
header,
.elementor-location-header {
  position: relative !important;
  z-index: 1000 !important;
}

/* ── Sisältöosiot overlayn yläpuolelle ──
   Hero on läpinäkyvä → panoraama näkyy siellä
   Muut osiot omalla taustavärillään → peittävät overlayn ── */
.elementor-section,
.elementor-top-section,
.e-con[data-element_type="container"] {
  position: relative !important;
  z-index: 2 !important;
}
</style>

<!-- Panorama canvas -->
<div id="asra-pano-wrap">
  <canvas id="asra-pano-canvas"></canvas>
</div>

<!-- Tumma overlay tekstien taustaksi -->
<div id="asra-overlay"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
<script>
(function () {
  var wrap   = document.getElementById('asra-pano-wrap');
  var canvas = document.getElementById('asra-pano-canvas');

  /* ── Konfiguraatio ──────────────────────────────
     Muuta näitä arvoja haluamaksesi:
     BASE_SPEED  = automaattipyörintä (0 = ei automaattia)
     SCROLL_MULT = scroll-boostin voimakkuus
     START_DEG   = aloituskulma asteina
     END_DEG     = loppukulma asteina (ping-pong tässä välillä)
  ── */
  var BASE_SPEED  = 0.00000;
  var SCROLL_MULT = 0.00006;
  var FRICTION    = 0.86;
  var START_DEG   = 210;
  var END_DEG     = 326;

  var START_RAD = START_DEG * Math.PI / 180;
  var END_RAD   = END_DEG   * Math.PI / 180;

  var currentAngle   = START_RAD;
  var direction      = 1;   /* 1 = eteenpäin, -1 = taaksepäin */
  var scrollVelocity = 0;
  var lastScrollY    = window.scrollY;

  /* ── Three.js ── */
  var scene    = new THREE.Scene();
  var camera   = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
  var renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  camera.position.set(0, 0, 0.01);

  window.addEventListener('resize', function () {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  /* Inside-out sphere */
  var geo = new THREE.SphereGeometry(500, 64, 32);
  geo.scale(-1, 1, 1);

  var sphere = null;
  new THREE.TextureLoader().load(
    'https://asuntoraatali.fi/wp-content/uploads/2026/06/spherical-scaled.jpg',
    function (tex) {
      tex.minFilter = tex.magFilter = THREE.LinearFilter;
      tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
      sphere = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ map: tex }));
      sphere.rotation.y = currentAngle;
      scene.add(sphere);
      wrap.style.display = 'block'; /* näytä vasta kun kuva on ladattu */
    }
  );

  /* ── Scroll boosti ── */
  window.addEventListener('scroll', function () {
    var dy = window.scrollY - lastScrollY;
    lastScrollY = window.scrollY;
    scrollVelocity += dy * SCROLL_MULT;
  });

  /* ── Animaatiosilmukka – ping-pong START_DEG–END_DEG välillä ── */
  function tick() {
    requestAnimationFrame(tick);

    currentAngle   += scrollVelocity;
    scrollVelocity *= FRICTION;

    currentAngle += BASE_SPEED * direction;

    /* Ping-pong: käänny reunoilla */
    if (direction > 0 && currentAngle >= END_RAD) {
      currentAngle = END_RAD;
      direction = -1;
    } else if (direction < 0 && currentAngle <= START_RAD) {
      currentAngle = START_RAD;
      direction = 1;
    }

    if (sphere) sphere.rotation.y = currentAngle;
    renderer.render(scene, camera);
  }
  tick();

})();
</script>
